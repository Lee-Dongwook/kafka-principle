// 공통 타입과 직렬화 인터페이스를 둡니다.
dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'net.jpountz.lz4:lz4:1.3.0'
    implementation 'org.xerial.snappy:snappy-java:1.1.10.7'
    implementation 'com.github.luben:zstd-jni:1.5.6-9'
    implementation 'org.slf4j:slf4j-api:2.0.16'
}

def generatedMessageDir = layout.buildDirectory.dir('generated/main/java')
def generatedMessagePackageDir = generatedMessageDir.map {
    it.dir('io/github/kafkaprinciple/common/message')
}
def messageSpecDir = layout.projectDirectory.dir('src/main/resources/common/message')

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', "${projectDir}/build/generated/main/java"]
        }
    }
}

tasks.register('generateCommonMessages', JavaExec) {
    group = 'build'
    description = 'Generates common message classes from JSON specifications.'

    dependsOn project(':message').tasks.named('classes')
    classpath = project(':message').sourceSets.main.runtimeClasspath
    mainClass = 'io.github.kafkaprinciple.message.MessageGenerator'

    inputs.dir(messageSpecDir)
    outputs.dir(generatedMessageDir)

    args(
        '--package', 'io.github.kafkaprinciple.common.message',
        '--output', generatedMessagePackageDir.get().asFile.absolutePath,
        '--input', messageSpecDir.asFile.absolutePath,
        '--message-class-generators', 'MessageDataGenerator'
    )
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateCommonMessages')
}
